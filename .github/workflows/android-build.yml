
name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'JARVIS_cloud_build.zip'
      - '.github/workflows/android-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project
        run: |
          unzip -q JARVIS_cloud_build.zip
          sed -i '/android\.aapt2FromMavenOverride/d' JARVIS/gradle.properties
          chmod +x JARVIS/gradlew

      - name: Build debug APK
        working-directory: JARVIS
        run: ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-debug-APK
          path: JARVIS/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

